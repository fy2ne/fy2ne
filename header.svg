<svg width="680" height="212" viewBox="0 0 680 212" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .mono {
        font-family: 'Courier New', Courier, monospace;
        font-size: 13px;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1.1s step-end infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="680" height="212" fill="#060606"/>

  <!-- Subtle scanline texture via very faint horizontal lines -->
  <rect width="680" height="212" fill="url(#scan)" opacity="0.03"/>
  <defs>
    <pattern id="scan" x="0" y="0" width="1" height="2" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="#ffffff"/>
    </pattern>
  </defs>

  <!-- Prompt line -->
  <text x="24" y="37" class="mono">
    <tspan fill="#2a2a40">fy2ne</tspan><tspan fill="#222234">@</tspan><tspan fill="#2a2a40">core</tspan><tspan fill="#222234"> ~ </tspan><tspan fill="#4a9e6b">$ </tspan><tspan fill="#b8c4dc">whois fy2ne</tspan>
  </text>

  <!-- Box border — very subtle, single pixel -->
  <rect x="24" y="52" width="630" height="142" rx="3" fill="#0b0b14" stroke="#16162a" stroke-width="1"/>

  <!-- Row 1: handle -->
  <text x="46" y="82" class="mono">
    <tspan fill="#3c3c58">handle  </tspan><tspan fill="#252535">·  </tspan><tspan fill="#c8d4ea">fy2ne</tspan>
  </text>

  <!-- Row 2: role -->
  <text x="46" y="103" class="mono">
    <tspan fill="#3c3c58">role    </tspan><tspan fill="#252535">·  </tspan><tspan fill="#c8d4ea">builder · founder</tspan>
  </text>

  <!-- Row 3: orgs -->
  <text x="46" y="124" class="mono">
    <tspan fill="#3c3c58">orgs    </tspan><tspan fill="#252535">·  </tspan><tspan fill="#c8d4ea">weavetab  /  essential-devs</tspan>
  </text>

  <!-- Row 4: stack -->
  <text x="46" y="145" class="mono">
    <tspan fill="#3c3c58">stack   </tspan><tspan fill="#252535">·  </tspan><tspan fill="#c8d4ea">node  ·  typescript  ·  c++</tspan>
  </text>

  <!-- Row 5: status -->
  <text x="46" y="166" class="mono">
    <tspan fill="#3c3c58">status  </tspan><tspan fill="#252535">·  </tspan><tspan fill="#c8d4ea">active</tspan><tspan fill="#7ba4fc" class="cursor"> ▋</tspan>
  </text>

  <!-- Accent bar top-left of box — 2px, cold blue -->
  <rect x="24" y="52" width="2" height="142" rx="1" fill="#7ba4fc" opacity="0.5"/>

</svg>
